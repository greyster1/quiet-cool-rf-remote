# Example ESPHome config for a QuietCool whole-house fan using this component
# (ESP32 + CC1101). Tested with the QuietCool remote FCC ID 2APQIITRFGLSWITCH01.
# Requires these entries in your ESPHome secrets.yaml:
#   wifi_ssid, wifi_password, fanremote2_api_key, fanremote2_ota_password, fanremote2_ap_password

esphome:
  name: fanremote2
  friendly_name: FanRemote2
  on_boot:
    # Template numbers don't run set_action when restoring; push the saved frequency to the radio
    priority: -100
    then:
      - lambda: |-
          if (!isnan(id(rf_freq).state)) id(whf_fan).set_center_frequency(id(rf_freq).state);
          if (id(fan_duration).has_state()) {
            auto opt = id(fan_duration).current_option();
            id(whf_fan).set_duration_hours(opt == std::string("On") ? 0 : atoi(opt.c_str()));
          }

esp32:
  board: esp32dev
  framework:
    type: arduino

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret fanremote2_api_key

ota:
  - platform: esphome
    password: !secret fanremote2_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Fanremote2 Fallback Hotspot"
    password: !secret fanremote2_ap_password

captive_portal:

spi:
  clk_pin: 18
  mosi_pin: 23
  miso_pin: 19

external_components:
  - source:
      type: git
      url: https://github.com/greyster1/quiet-cool-rf-remote.git
      ref: whf-fixes
    refresh: always
    components: [ quiet_cool ]

fan:
  - platform: quiet_cool
    id: whf_fan
    name: QuietCool fan
    cs_pin: 15
    gdo0_pin: 13
    gdo2_pin: 12
    # EXAMPLE ID ONLY -- replace with the 7 bytes decoded from your own remote.
    # They are the 7 bytes that follow the 15 AA AA AA AA AA AA AA AA sync in a capture.
    remote_id: [0x2D, 0xD4, 0x06, 0xCB, 0x00, 0x12, 0x34]
    # Board-specific: CC1101 modules are often tens of kHz off. Sweep with the
    # "RF frequency" box + "Resend fan command" button below, then set the middle
    # of the range your fan responds to (this board: 433.85-433.87 worked).
    center_freq_mhz: 433.86
    tx_power_dbm: 10        # max for CC1101; upstream hard-coded 0
#   deviation_khz: 10       # now actually applied (upstream ignored it)

# Tuning aids: change the frequency from HA, then press "Resend" and watch the fan.
number:
  - platform: template
    id: rf_freq
    name: RF frequency
    icon: mdi:sine-wave
    unit_of_measurement: MHz
    mode: box
    min_value: 433.70
    max_value: 434.10
    step: 0.005
    initial_value: 433.86
    optimistic: true
    restore_value: true
    entity_category: config
    set_action:
      - lambda: id(whf_fan).set_center_frequency(x);

button:
  - platform: template
    name: Resend fan command
    icon: mdi:broadcast
    entity_category: config
    on_press:
      - lambda: id(whf_fan).resend();

# Remote's timer setting. "On" = run until turned off; otherwise the fan stops itself after N hours.
select:
  - platform: template
    id: fan_duration
    name: Fan duration
    icon: mdi:timer-outline
    options: ["On", "1h", "2h", "4h", "8h", "12h"]
    initial_option: "On"
    optimistic: true
    restore_value: true
    set_action:
      - lambda: |-
          id(whf_fan).set_duration_hours(x == std::string("On") ? 0 : atoi(x.c_str()));
